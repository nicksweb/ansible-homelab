# this create a  SNMPv1/SNMPv2c community named "my_servers"
# Replace the example community and documentation network before deployment.
rocommunity CHANGE_ME 192.0.2.0/24

# setup info
syslocation  "SANetwork"
syscontact  "admin@example.com"

# open up
agentAddress  udp:161

# run as
agentuser  root

# dont log connection from UDP:
dontLogTCPWrappersConnects yes

# fix for disks larger then 2TB
realStorageUnits 0
