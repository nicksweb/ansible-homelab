---
- name: Read API credentials from the gitignored auth file
  ansible.builtin.set_fact:
    vhosts_cf_token: "{{ (vhosts_auth | regex_search('(?m)^CLOUDFLARE_API_TOKEN=(.*)$', '\\1') or [''])[0] | trim }}"
    vhosts_cf_account: "{{ (vhosts_auth | regex_search('(?m)^CLOUDFLARE_ACCOUNT_ID=(.*)$', '\\1') or [''])[0] | trim }}"
    vhosts_udm_host: "{{ (vhosts_auth | regex_search('(?m)^UbiquitiRouter=(.*)$', '\\1') or [''])[0] | trim }}"
    vhosts_udm_key: "{{ (vhosts_auth | regex_search('(?m)^UbiquitiKey=(.*)$', '\\1') or [''])[0] | trim }}"
  vars:
    vhosts_auth: "{{ lookup('ansible.builtin.file', prov_api_auth_file) }}"
  no_log: true

- name: Require the credentials this role uses
  ansible.builtin.assert:
    that:
      - vhosts_cf_token | length > 0
      - vhosts_cf_account | length > 0
      - vhosts_udm_host | length > 0
      - vhosts_udm_key | length > 0
    fail_msg: "{{ prov_api_auth_file }} needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, UbiquitiRouter and UbiquitiKey."
    quiet: true
  no_log: true

- name: List Cloudflare zones
  ansible.builtin.uri:
    url: "{{ vhosts_cf_api }}/zones?per_page=200"
    headers:
      Authorization: "Bearer {{ vhosts_cf_token }}"
  delegate_to: localhost
  become: false
  register: vhosts_zones
  failed_when: false
  no_log: true

- name: Zone list succeeded
  ansible.builtin.assert:
    that: vhosts_zones.status == 200
    fail_msg: "Cloudflare zone list failed: HTTP {{ vhosts_zones.status }} {{ vhosts_zones.json.errors | default('') }}"
    quiet: true

- name: Match each vhost to its zone (longest suffix — Cloudflare files a record under the wrong zone rather than rejecting it)
  ansible.builtin.set_fact:
    vhosts_zone_of: >-
      {%- set out = {} -%}
      {%- for v in vhosts_list -%}
      {%-   set best = namespace(name='', id='') -%}
      {%-   for z in vhosts_zones.json.result -%}
      {%-     if ('.' ~ v.hostname).endswith('.' ~ z.name) and z.name | length > best.name | length -%}
      {%-       set best.name = z.name -%}
      {%-       set best.id = z.id -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   set _ = out.update({v.hostname: best.id}) -%}
      {%- endfor -%}
      {{ out }}

- name: Every vhost is in one of this account's zones
  ansible.builtin.assert:
    that: vhosts_zone_of[item.hostname] | length > 0
    fail_msg: "No Cloudflare zone in this account covers {{ item.hostname }} (zones: {{ vhosts_zones.json.result | map(attribute='name') | join(', ') }})."
    quiet: true
  loop: "{{ vhosts_list }}"
  loop_control:
    label: "{{ item.hostname }}"
