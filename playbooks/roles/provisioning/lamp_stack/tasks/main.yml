---
# Installs the LAMP stack: Apache 2 + MySQL 8 + PHP 8.3 + Composer + certbot.
# Ported from provisioning/binarylane/scripts/install-lamp.sh.
#
# Self-contained rather than wrapping the geerlingguy.apache/php/mysql
# Galaxy roles already in requirements.yml: those roles' own vhost/config
# management would need to be almost entirely overridden to match the
# vhosts.d include-directory convention every other BinaryLane script in
# this repo assumes (add-site-remote.sh, certbot_http01, certbot_dns01),
# so wrapping them added indirection without actually saving work. Kept
# consistent with every other role in this build instead: plain apt/
# template tasks, full control over the exact package list and config.

- name: Determine the welcome-page FQDN
  ansible.builtin.command: hostname -f
  register: lamp_stack_hostname_fqdn
  changed_when: false
  when: lamp_stack_welcome_fqdn | length == 0

- name: Set the effective welcome FQDN
  ansible.builtin.set_fact:
    lamp_stack_effective_welcome_fqdn: "{{ lamp_stack_welcome_fqdn if lamp_stack_welcome_fqdn | length > 0 else lamp_stack_hostname_fqdn.stdout }}"

- name: apt update
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install Apache
  ansible.builtin.apt:
    name: apache2
    state: present
  become: true

- name: Enable Apache modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ lamp_stack_apache_modules }}"
  become: true

- name: Ensure /etc/apache2/vhosts.d exists
  ansible.builtin.file:
    path: /etc/apache2/vhosts.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Include vhosts.d in apache2.conf
  ansible.builtin.lineinfile:
    path: /etc/apache2/apache2.conf
    line: "IncludeOptional vhosts.d/*.conf"
  become: true

- name: Disable the default site
  # Ubuntu's stock sites-enabled/000-default.conf loads before our
  # appended vhosts.d include, so it wins as the default (no-ServerName)
  # vhost unless disabled — matches the convention of not using
  # sites-enabled at all.
  ansible.builtin.command: a2dissite 000-default
  become: true
  changed_when: true
  failed_when: false

- name: Install MySQL server
  when: not lamp_stack_skip_mysql
  become: true
  block:
    - name: Install mysql-server
      ansible.builtin.apt:
        name: mysql-server
        state: present

    - name: Bind mysqld to loopback only
      # Never expose the database port publicly — only restarts MySQL
      # when this actually changes (a deliberate improvement over the
      # original script's unconditional restart, matching the same choice
      # made in mysql_standalone).
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: "bind-address\t\t= 127.0.0.1"
      register: lamp_stack_bind_address
      notify: "restart mysql"

- name: Flush handlers so a bind-address change takes effect now
  ansible.builtin.meta: flush_handlers

- name: Install PHP 8.3 and extensions
  ansible.builtin.apt:
    name: "{{ lamp_stack_php_packages }}"
    state: present
  become: true

- name: Detect the installed PHP version
  ansible.builtin.command: php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;'
  register: lamp_stack_php_version
  changed_when: false

- name: Enable proxy_fcgi and setenvif modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: [proxy_fcgi, setenvif]
  become: true

- name: Enable the PHP-FPM Apache conf
  ansible.builtin.command: "a2enconf php{{ lamp_stack_php_version.stdout }}-fpm"
  become: true
  changed_when: true
  failed_when: false

- name: Enable and start PHP-FPM
  ansible.builtin.systemd:
    name: "php{{ lamp_stack_php_version.stdout }}-fpm"
    enabled: true
    state: started
  become: true

- name: Check whether Composer is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/composer
  register: lamp_stack_composer_present

- name: Install Composer
  # No first-class Ansible module for "verify a downloaded installer
  # against a signature fetched from a different URL, fail closed" — hand-
  # assembled from get_url + a checksum comparison, same as the original
  # script's curl+sha384sum logic.
  when: not lamp_stack_composer_present.stat.exists
  become: true
  block:
    - name: Fetch the expected installer signature
      ansible.builtin.uri:
        url: https://composer.github.io/installer.sig
        return_content: true
      register: lamp_stack_composer_expected_sig

    - name: Download the Composer installer
      ansible.builtin.get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-setup.php
        mode: '0644'

    - name: Compute the installer's actual signature
      ansible.builtin.command: sha384sum /tmp/composer-setup.php
      register: lamp_stack_composer_actual_sig
      changed_when: false

    - name: Verify the signature matches (fail closed)
      ansible.builtin.assert:
        that: lamp_stack_composer_actual_sig.stdout.split(' ')[0] == lamp_stack_composer_expected_sig.content.strip()
        fail_msg: "Composer installer signature mismatch — aborting."

    - name: Run the Composer installer
      ansible.builtin.command: >
        php /tmp/composer-setup.php --install-dir=/usr/local/bin
        --filename=composer --quiet

    - name: Remove the installer
      ansible.builtin.file:
        path: /tmp/composer-setup.php
        state: absent

- name: Install certbot (not auto-issuing — see certbot_http01/certbot_dns01 roles)
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-apache
    state: present
  become: true

- name: Confirm git is present
  ansible.builtin.command: git --version
  changed_when: false

- name: Write the test vhost welcome page
  ansible.builtin.file:
    path: /var/www/html/provision-test
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  become: true

- name: Write the welcome page content
  ansible.builtin.template:
    src: welcome_page.php.j2
    dest: /var/www/html/provision-test/index.php
    owner: www-data
    group: www-data
    mode: '0644'
  become: true

- name: Write the test vhost
  ansible.builtin.template:
    src: 000-provision-test.conf.j2
    dest: /etc/apache2/vhosts.d/000-provision-test.conf
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Validate the Apache config
  ansible.builtin.command: apache2ctl configtest
  become: true
  changed_when: false

- name: Enable and reload Apache
  ansible.builtin.systemd:
    name: apache2
    enabled: true
    state: reloaded
  become: true

- name: Report versions
  ansible.builtin.debug:
    msg:
      - "PHP_VERSION={{ lamp_stack_php_version.stdout }}"
      - "MYSQL_SKIPPED={{ lamp_stack_skip_mysql }}"
