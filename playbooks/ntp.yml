---
# Configure NTP and timezone using Ansible native modules
# Sets NTP to Australian pool and timezone to Australia/Brisbane

- name: Configure NTP and Timezone
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    ntp_timezone: Australia/Brisbane
    ntp_servers:
      - 0.au.pool.ntp.org
      - 1.au.pool.ntp.org
      - 2.au.pool.ntp.org
      - 3.au.pool.ntp.org

  tasks:
    # ========================================================================
    # Timezone Configuration
    # ========================================================================
    - name: Set timezone to Australia/Brisbane
      timezone:
        name: "{{ ntp_timezone }}"

    - name: Verify timezone is set
      shell: timedatectl show --property=Timezone --value
      register: current_timezone
      changed_when: false

    - name: Display current timezone
      debug:
        msg: "Timezone is set to: {{ current_timezone.stdout }}"

    # ========================================================================
    # NTP Configuration (systemd-timesyncd)
    # ========================================================================
    - name: Install chrony NTP daemon (for better NTP support)
      apt:
        name: chrony
        state: present

    - name: Configure chrony with Australian NTP pool
      copy:
        dest: /etc/chrony/chrony.conf
        content: |
          # Generated by Ansible NTP playbook
          # Australian NTP Pool Configuration

          # NTP servers
          server 0.au.pool.ntp.org iburst maxdelay 1
          server 1.au.pool.ntp.org iburst maxdelay 1
          server 2.au.pool.ntp.org iburst maxdelay 1
          server 3.au.pool.ntp.org iburst maxdelay 1

          # Local clock as fallback
          local stratum 10

          # Drift file
          driftfile /var/lib/chrony/chrony.drift

          # Log files
          logdir /var/log/chrony

          # Performance
          rtcfile /var/lib/chrony/rtc
          rtcsync

          # Security
          bindcmdaddress 127.0.0.1
          bindcmdaddress ::1
        owner: root
        group: root
        mode: '0644'
      register: chrony_config

    - name: Enable and start chrony service
      systemd:
        name: chrony
        state: restarted
        enabled: yes
        daemon_reload: yes
      when: chrony_config.changed

    - name: Wait for time sync
      pause:
        seconds: 5

    # ========================================================================
    # Verification
    # ========================================================================
    - name: Check NTP status
      shell: chronyc tracking
      register: ntp_status
      changed_when: false
      failed_when: false

    - name: Display NTP status
      debug:
        msg: |
          NTP Status:
          {{ ntp_status.stdout }}

    - name: Check system time synchronization
      shell: timedatectl status
      register: time_status
      changed_when: false

    - name: Display time synchronization status
      debug:
        msg: |
          Time Synchronization Status:
          {{ time_status.stdout }}

