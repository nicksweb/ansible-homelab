- name: Bootstrap
  hosts: setup 
  gather_facts: yes
  become: true
  become_user: root

  vars:
    ntp_timezone: Australia/Brisbane
    ntp_servers:
      - 0.au.pool.ntp.org
      - 1.au.pool.ntp.org
      - 2.au.pool.ntp.org
      - 3.au.pool.ntp.org

  vars_prompt:
    - name: passwd
      prompt: "Enter the desired {{ create_user }} password"
      private: yes

  roles:
    - bootstrap

  post_tasks:
    # ========================================================================
    # Timezone Configuration
    # ========================================================================
    - name: Set timezone to Australia/Brisbane
      timezone:
        name: "{{ ntp_timezone }}"

    # ========================================================================
    # NTP Configuration (Chrony)
    # ========================================================================
    - name: Install chrony NTP daemon
      apt:
        name: chrony
        state: present

    - name: Configure chrony with Australian NTP pool
      copy:
        dest: /etc/chrony/chrony.conf
        content: |
          # Generated by Ansible bootstrap playbook
          # Australian NTP Pool Configuration

          # NTP servers
          server 0.au.pool.ntp.org iburst maxdelay 1
          server 1.au.pool.ntp.org iburst maxdelay 1
          server 2.au.pool.ntp.org iburst maxdelay 1
          server 3.au.pool.ntp.org iburst maxdelay 1

          # Local clock as fallback
          local stratum 10

          # Drift file
          driftfile /var/lib/chrony/chrony.drift

          # Log files
          logdir /var/log/chrony

          # Performance
          rtcfile /var/lib/chrony/rtc
          rtcsync

          # Security
          bindcmdaddress 127.0.0.1
          bindcmdaddress ::1
        owner: root
        group: root
        mode: '0644'
      register: chrony_config

    - name: Enable and start chrony service
      systemd:
        name: chrony
        state: restarted
        enabled: yes
        daemon_reload: yes
      when: chrony_config.changed

    - name: Wait for time sync
      pause:
        seconds: 3

    - name: Display timezone and NTP status
      debug:
        msg: |
          Timezone: {{ ntp_timezone }}
          NTP Servers: {{ ntp_servers | join(', ') }}
          Status: Configuration applied

