---
- name: Enable passwordless sudo for Ansible-managed accounts
  hosts: all
  gather_facts: false
  become: true

  vars:
    sudo_user: "{{ ansible_user | default('localadmin') }}"

  tasks:
    - name: Explain why root does not need a sudoers entry
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} connects as root; no sudoers entry is needed."
      when: sudo_user == 'root'

    - name: Install and validate passwordless sudo policy
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-ansible-{{ sudo_user }}"
        content: "{{ sudo_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      when: sudo_user != 'root'
