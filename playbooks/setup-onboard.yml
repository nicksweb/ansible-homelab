---
# Onboard new machine into Ansible homelab
# Sets up SSH, timezone, NTP, installs monitoring tools, hardens system
#
# Usage:
#   Minimal (SSH key already configured):
#   ansible-playbook playbooks/setup-onboard.yml -i inventory -kK --limit "new_host"
#
#   With hostname and IP configuration:
#   ansible-playbook playbooks/setup-onboard.yml -i inventory -kK --limit "new_host" \
#     -e "host_hostname=myserver host_ipaddr=203.0.113.100 host_netmask=255.255.255.0 host_gateway=203.0.113.1"
#
# Variables (all optional):
#   host_hostname: New hostname (e.g., docker-01, server-lamp)
#   host_ipaddr: Static IP address (e.g., 198.51.100.100)
#   host_netmask: Network mask (e.g., 255.255.255.0 or /24)
#   host_gateway: Default gateway (e.g., 192.0.2.1)
#   host_dns_servers: DNS servers as list (default: [8.8.8.8, 1.1.1.1])
#   host_interface: Network interface to configure (default: auto-detect)
#   generate_ssh_key: Generate SSH key on host (default: true)
#   sshd_port: SSH port (default: 22)
#   ntp_timezone: Timezone (default: Australia/Brisbane)
#   ntp_servers: NTP servers list (default: Australian pool)

- name: Onboard New Machine
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    # Defaults - override with -e or group_vars
    host_dns_servers:
      - 8.8.8.8
      - 1.1.1.1
    generate_ssh_key: true
    sshd_port: 22
    monitoring_packages:
      - bwm-ng
      - vnstat
      - htop
    ntp_timezone: Australia/Brisbane
    ntp_servers:
      - 0.au.pool.ntp.org
      - 1.au.pool.ntp.org
      - 2.au.pool.ntp.org
      - 3.au.pool.ntp.org

  tasks:
    # ========================================================================
    # System Update
    # ========================================================================
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        force_apt_get: yes

    - name: Install monitoring and utility packages
      apt:
        name: "{{ monitoring_packages }}"
        state: present

    - name: Clean up packages
      apt:
        autoremove: yes
        autoclean: yes

    # ========================================================================
    # Hostname Configuration (if specified)
    # ========================================================================
    - name: Set hostname
      hostname:
        name: "{{ host_hostname }}"
      when: host_hostname is defined
      register: hostname_changed

    - name: Update /etc/hosts with new hostname
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ host_hostname }}"
        state: present
      when: host_hostname is defined

    # ========================================================================
    # Network Configuration (if IP specified)
    # ========================================================================
    - name: Auto-detect primary network interface
      set_fact:
        primary_interface: "{{ ansible_default_ipv4.interface }}"
      when: host_interface is not defined and host_ipaddr is defined

    - name: Configure network interface (Netplan - Ubuntu 18.04+)
      block:
        - name: Create netplan configuration
          template:
            dest: /etc/netplan/50-cloud-init.yaml
            content: |
              network:
                version: 2
                ethernets:
                  {{ primary_interface }}:
                    dhcp4: false
                    addresses:
                      - {{ host_ipaddr }}/{{ host_netmask | regex_replace('^255\.255\.255\.', '') if '255' in host_netmask else host_netmask }}
                    gateway4: {{ host_gateway }}
                    nameservers:
                      addresses: {{ host_dns_servers }}
            owner: root
            group: root
            mode: '0644'
          register: netplan_config

        - name: Apply netplan configuration
          command: netplan apply
          when: netplan_config.changed

        - name: Restart networking service
          systemd:
            name: systemd-networkd
            state: restarted
            daemon_reload: yes
          when: netplan_config.changed
      when: host_ipaddr is defined and ansible_os_family == "Debian"

    # ========================================================================
    # SSH Hardening
    # ========================================================================
    - name: SSH | Create sshd_config.d directory
      file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: '0755'

    - name: SSH | Harden SSH configuration
      copy:
        dest: /etc/ssh/sshd_config.d/99-hardened.conf
        content: |
          # Generated by Ansible onboarding playbook
          # SSH Security Hardening Configuration

          # Authentication
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication no
          PermitEmptyPasswords no
          AuthenticationMethods publickey

          # Only allow specific users (optional, comment out if not needed)
          # AllowUsers localadmin root

          # Protocol & Encryption
          Protocol 2
          AddressFamily any
          ListenAddress 0.0.0.0
          ListenAddress ::
          Port {{ sshd_port }}

          # Timeout & Keepalive
          ClientAliveInterval 300
          ClientAliveCountMax 3
          TCPKeepAlive yes

          # Logging
          SyslogFacility AUTH
          LogLevel VERBOSE

          # X11 & Forwarding
          X11Forwarding no
          AllowTcpForwarding no
          AllowStreamLocalForwarding no

          # Misc
          Compression delayed
          ClientAliveInterval 300
          ClientAliveCountMax 2
          DebianBanner no
        owner: root
        group: root
        mode: '0600'
      register: sshd_config

    - name: SSH | Validate SSH configuration
      command: sshd -t
      changed_when: false
      failed_when: false
      register: sshd_test

    - name: SSH | Fail if SSH config is invalid
      fail:
        msg: "SSH configuration is invalid: {{ sshd_test.stderr }}"
      when: sshd_test.rc != 0

    - name: SSH | Restart SSH service
      systemd:
        name: ssh
        state: restarted
        daemon_reload: yes
      when: sshd_config.changed

    # ========================================================================
    # Sudo Configuration (Passwordless for Ansible user)
    # ========================================================================
    - name: Sudo | Create sudoers.d directory
      file:
        path: /etc/sudoers.d
        state: directory
        mode: '0755'

    - name: Sudo | Enable passwordless sudo for ansible user
      lineinfile:
        path: /etc/sudoers.d/ansible-nopasswd
        line: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"
        create: yes
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    # ========================================================================
    # Proxmox QEMU Guest Agent
    # ========================================================================
    - name: Proxmox | Check if running on Proxmox VE
      stat:
        path: /sys/class/dmi/id/system_manufacturer
      register: proxmox_check

    - name: Proxmox | Read system manufacturer
      shell: cat /sys/class/dmi/id/system_manufacturer 2>/dev/null || echo "Unknown"
      register: system_manufacturer
      changed_when: false
      when: proxmox_check.stat.exists

    - name: Proxmox | Set Proxmox VM flag
      set_fact:
        is_proxmox_vm: "{{ 'Proxmox' in system_manufacturer.stdout }}"
      when: proxmox_check.stat.exists

    - name: Proxmox | Install qemu-guest-agent
      apt:
        name: qemu-guest-agent
        state: present
      when: is_proxmox_vm | default(false)
      register: qemu_agent_installed

    - name: Proxmox | Enable and start qemu-guest-agent service
      systemd:
        name: qemu-guest-agent
        state: started
        enabled: yes
        daemon_reload: yes
      when: is_proxmox_vm | default(false)

    - name: Proxmox | Verify qemu-guest-agent is running
      shell: systemctl is-active qemu-guest-agent
      changed_when: false
      failed_when: false
      register: qemu_agent_status
      when: is_proxmox_vm | default(false)

    # ========================================================================
    # Timezone and NTP Configuration
    # ========================================================================
    - name: Timezone | Set timezone to Australia/Brisbane
      timezone:
        name: "{{ ntp_timezone }}"

    - name: NTP | Install chrony NTP daemon
      apt:
        name: chrony
        state: present

    - name: NTP | Configure chrony with Australian NTP pool
      copy:
        dest: /etc/chrony/chrony.conf
        content: |
          # Generated by Ansible onboarding playbook
          # Australian NTP Pool Configuration

          # NTP servers
          server 0.au.pool.ntp.org iburst maxdelay 1
          server 1.au.pool.ntp.org iburst maxdelay 1
          server 2.au.pool.ntp.org iburst maxdelay 1
          server 3.au.pool.ntp.org iburst maxdelay 1

          # Local clock as fallback
          local stratum 10

          # Drift file
          driftfile /var/lib/chrony/chrony.drift

          # Log files
          logdir /var/log/chrony

          # Performance
          rtcfile /var/lib/chrony/rtc
          rtcsync

          # Security
          bindcmdaddress 127.0.0.1
          bindcmdaddress ::1
        owner: root
        group: root
        mode: '0644'
      register: chrony_config

    - name: NTP | Enable and start chrony service
      systemd:
        name: chrony
        state: restarted
        enabled: yes
        daemon_reload: yes
      when: chrony_config.changed

    - name: NTP | Wait for time sync
      pause:
        seconds: 3

    - name: NTP | Check NTP status
      shell: chronyc tracking 2>/dev/null || echo "NTP not yet synchronized"
      register: ntp_status
      changed_when: false
      failed_when: false

    # ========================================================================
    - name: SSH | Create .ssh directory for ansible user
      file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'
      when: generate_ssh_key and ansible_user != 'root'

    - name: SSH | Create .ssh directory for root
      file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: generate_ssh_key and ansible_user == 'root'

    - name: SSH | Generate SSH key pair on host
      openssh_keypair:
        path: "/home/{{ ansible_user }}/.ssh/id_ed25519"
        type: ed25519
        state: present
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      register: host_key_generated
      when: generate_ssh_key and ansible_user != 'root'

    - name: SSH | Generate SSH key pair for root
      openssh_keypair:
        path: /root/.ssh/id_ed25519
        type: ed25519
        state: present
        owner: root
        group: root
        mode: '0600'
      register: host_key_generated_root
      when: generate_ssh_key and ansible_user == 'root'

    - name: SSH | Display generated public key
      debug:
        msg: |
          SSH Key generated on {{ inventory_hostname }}
          Public key location: ~/.ssh/id_ed25519.pub
          Private key location: ~/.ssh/id_ed25519
          
          To retrieve the public key, run:
          ssh {{ ansible_user }}@{{ inventory_hostname }} cat ~/.ssh/id_ed25519.pub
      when: generate_ssh_key and (host_key_generated.changed or host_key_generated_root.changed)

    # ========================================================================
    # Verification & Summary
    # ========================================================================
    - name: Get system information
      setup:
        filter: ansible_*
      when: false

    - name: Display onboarding summary
      debug:
        msg: |
          ========================================
          Machine Onboarded: {{ inventory_hostname }}
          ========================================
          
          System Information:
            OS: {{ ansible_os_family }} {{ ansible_distribution_version }}
            Kernel: {{ ansible_kernel }}
            Hostname: {{ ansible_hostname }}
            IP Address: {{ ansible_default_ipv4.address }}
          
          Packages Installed:
          {% for pkg in monitoring_packages %}
            - {{ pkg }}
          {% endfor %}
          
          SSH Configuration:
            Port: {{ sshd_port }}
            Auth Method: Public Key Only
            Password Auth: Disabled
            Root Login: Disabled
          
          Sudo Configuration:
            Passwordless sudo: ENABLED for {{ ansible_user }}
            Use: sudo -n command (no password required)
          
          {% if is_proxmox_vm | default(false) %}
          Proxmox Integration:
            ✓ QEMU Guest Agent: Installed
            Status: {{ qemu_agent_status.stdout }}
          {% else %}
          Proxmox Integration:
            Not detected as Proxmox VM
          {% endif %}
          
          Timezone and NTP:
            Timezone: {{ ntp_timezone }}
            NTP Servers: {{ ntp_servers | join(', ') }}
            NTP Service: Chrony (enabled)
          
          {% if host_hostname is defined %}
          Hostname Updated:
            Old: {{ ansible_hostname }}
            New: {{ host_hostname }}
          {% endif %}
          
          {% if generate_ssh_key %}
          SSH Key Generated on host
          {% endif %}
          
          Next Steps:
            1. Verify SSH connectivity: ssh {{ ansible_user }}@{{ inventory_hostname }}
            2. Test passwordless sudo: ssh {{ ansible_user }}@{{ inventory_hostname }} "sudo -n whoami"
            3. Test monitoring tools: htop, bwm-ng, vnstat
            4. Move host from 'setup' group to production group
            5. Run other setup playbooks as needed

    - name: Check if reboot is needed
      register: reboot_required_file
      stat:
        path: /var/run/reboot-required
        get_md5: no

    - name: Inform about potential reboot
      debug:
        msg: "System reboot may be required for kernel updates. Run 'ansible -i inventory {{ inventory_hostname }} -m reboot' when ready."
      when: reboot_required_file.stat.exists
